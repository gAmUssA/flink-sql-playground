<!DOCTYPE html>
<html lang="en" data-theme="nebula" data-density="regular" data-glow="off" data-embed="1">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Asset and link base. The bundled app serves from "/"; the static GitHub Pages build rewrites it to its subpath. -->
    <base href="/" />
    <title>Flink SQL Playground (embedded fiddle)</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233b82f6'/%3E%3Cpath d='M16 5l9 5-9 5-9-5 9-5z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M7 16l9 5 9-5' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Web fonts load after first paint (js/app.js): the page renders with system fonts, then swaps. -->
    <link id="webfonts" rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/embed.css" />
</head>
<body>
<!-- The compact view for an <iframe> (ADR 0008). app.js runs it with data-embed="1": no session until
     the first Run, no sidebar, header, tour or tweaks. It is the only page that may be framed. -->
<!-- data-mview="results": the phone rules of style.css hide .results unless the app shows its Results view. -->
<div class="app embed-app" data-mview="results">
    <div class="embed-bar">
        <button id="run-query-btn" class="btn run sm"><span data-icon="play" data-size="14"></span> <span class="run-label">Run Query</span></button>
        <button id="embed-schema-toggle" type="button" class="btn outline sm" aria-expanded="false" aria-controls="schema-panel"><span data-icon="db" data-size="14"></span> Schema</button>
        <span class="embed-mode" id="status-mode">Streaming</span>
        <div class="tb-spacer"></div>
        <a id="embed-open" class="btn ghost sm embed-open" href="./" target="_blank" rel="noopener">Open in playground <span data-icon="ext" data-size="13"></span></a>
    </div>

    <main class="embed-editors">
        <section class="pane editor-panel" id="schema-panel" hidden>
            <div class="panel-head"><span class="panel-title">Schema</span><span class="panel-badge">DDL, read-only</span></div>
            <div class="pane-body"><div id="schema-editor" class="editor-mount"></div></div>
        </section>
        <section class="pane editor-panel" id="query-panel">
            <div class="pane-body"><div id="query-editor" class="editor-mount"></div></div>
        </section>
    </main>

    <section class="results" id="results-panel">
        <div class="results-head">
            <div class="results-tabs" id="results-tabs" role="group" aria-label="Results view">
                <button class="rtab is-active" data-tab="table"><span data-icon="grid" data-size="13"></span> Table</button>
                <button class="rtab" data-tab="changelog"><span data-icon="pulse" data-size="13"></span> Changelog <span class="rtab-count" id="tab-count-changelog" style="display:none">0</span></button>
                <button class="rtab" data-tab="graph"><span data-icon="flow" data-size="13"></span> Job Graph</button>
                <button class="rtab" data-tab="timeline"><span data-icon="clock" data-size="13"></span> Timeline</button>
            </div>
        </div>
        <div class="results-body" id="results-container"></div>
    </section>
    <footer class="embed-foot">
        <span class="res-run" id="res-run" style="display:none"><i class="rv-live-dot"></i> streaming</span>
        <span class="tb-status st-ready" id="tb-status" role="status" aria-live="polite">
            <i class="tb-status-dot"></i>
            <span id="status-text">Press Run to start</span>
        </span>
    </footer>
</div>

<script defer src="js/editor.bundle.js"></script>
<script defer src="js/examples.js"></script>
<script defer src="js/fiddle-link.js"></script>
<script defer src="js/embed-params.js"></script>
<script defer src="js/job-graph.js"></script>
<script defer src="js/watermark-timeline.js"></script>
<script defer src="js/config.js"></script>
<script defer src="js/app.js"></script>
</body>
</html>
