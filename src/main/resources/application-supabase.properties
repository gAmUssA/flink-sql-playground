# Supabase / PostgreSQL profile — activate with -Dquarkus.profile=supabase
# (the pooled Supabase connection needs prepared-statement caching disabled).
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${SUPABASE_DB_URL}?prepareThreshold=0
quarkus.datasource.username=${SUPABASE_DB_USER}
quarkus.datasource.password=${SUPABASE_DB_PASSWORD}

# Small pool sized for the Supabase pooler (mirrors the old Hikari settings).
quarkus.datasource.jdbc.max-size=3
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.max-lifetime=29M
quarkus.datasource.jdbc.acquisition-timeout=20S

# Let the pool go fully quiet when idle so Railway app sleeping can kick in
# (it needs ~10 min with no outbound traffic). Background validation pinged the
# Supabase pooler every 2M per connection, which kept the container awake 24/7.
# Validate on checkout instead, only for connections idle longer than 1M.
quarkus.datasource.jdbc.background-validation-interval=0
quarkus.datasource.jdbc.foreground-validation-interval=1M
quarkus.datasource.jdbc.idle-removal-interval=2M

# Flyway baseline for an existing (non-empty) Supabase database.
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0

# Disable JDBC statement batching (pooled/pgbouncer compatibility).
quarkus.hibernate-orm.jdbc.statement-batch-size=0
