# HTTP
# Honor the platform-assigned $PORT (Railway/Fly/etc.) and fall back to 9090 locally.
quarkus.http.port=${PORT:9090}

# Response compression (gzip/deflate) for text-heavy payloads: the SPA assets (HTML/CSS/JS)
# and JSON query results. Applies only to Quarkus's default compress-media-types, which does
# NOT include application/x-ndjson — so the live streaming endpoint (/execute/stream) is left
# uncompressed and unbuffered, preserving row-at-a-time delivery.
quarkus.http.enable-compression=true

# CORS (replaces Spring WebMvcConfigurer.addCorsMappings on /api/**)
# Intentionally open: this is a public, no-auth playground and the API is meant to be
# callable from anywhere. Pin origins via $CORS_ORIGINS in a locked-down deployment.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:/.*/}
quarkus.http.cors.methods=GET,POST,DELETE

# Security response headers (defense-in-depth hardening for the served SPA).
# Applied to every response; harmless on the JSON API. HSTS only takes effect over
# HTTPS (ignored on the plain-HTTP dev port), so it's safe to send unconditionally and
# is honoured by the TLS-terminating edge in production.
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."Referrer-Policy".value=strict-origin-when-cross-origin
quarkus.http.header."Strict-Transport-Security".value=max-age=31536000; includeSubDomains
quarkus.http.header."Permissions-Policy".value=camera=(), microphone=(), geolocation=()
# CSP allow-list matches what index.html actually loads: Monaco editor from jsDelivr
# (script + AMD modules fetched via XHR + blob web workers) and Google Fonts. 'unsafe-inline'
# for styles covers Monaco's injected styles and the few inline style attributes in the SPA.
quarkus.http.header."Content-Security-Policy".value=default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; script-src 'self' https://cdn.jsdelivr.net; worker-src 'self' blob:; connect-src 'self' https://cdn.jsdelivr.net

# Datasource — default profile: H2 in-memory (matches the original Spring local config).
# The supabase profile (application-supabase.properties) overrides this to PostgreSQL.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:fiddledb;DB_CLOSE_DELAY=-1

# Hibernate ORM — validate the schema; Flyway owns DDL and runs first at startup.
quarkus.hibernate-orm.schema-management.strategy=validate
# Pin the JDBC time zone so timestamp binds/reads are deterministic across hosts and
# migrations (H2 locally, PostgreSQL on Supabase) rather than following the JVM default zone.
quarkus.hibernate-orm.jdbc.timezone=UTC

# Flyway — run migrations on startup (db/migration is the default classpath location).
quarkus.flyway.migrate-at-start=true

# Flink
flink.parallelism=1
flink.network-memory=8m
flink.managed-memory=32m
flink.max-sessions=8
flink.session-idle-timeout=3m

# Execution limits
execution.max-rows=1000
execution.execution-timeout=30s
execution.collection-timeout=15s
execution.stream-timeout=3m

# Logging
quarkus.log.category."com.flinksqlfiddle".level=DEBUG
quarkus.log.category."org.apache.flink".level=WARN
quarkus.log.category."org.hibernate".level=WARN
quarkus.log.category."org.apache.calcite".level=WARN
quarkus.log.category."org.apache.pekko".level=WARN
# Suppress Flink MiniCluster lifecycle noise (harmless in embedded mode)
quarkus.log.category."org.apache.flink.runtime.security.token".level=ERROR
quarkus.log.category."org.apache.flink.runtime.webmonitor".level=ERROR
quarkus.log.category."org.apache.flink.streaming.api.operators.collect".level=ERROR
