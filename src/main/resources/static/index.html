<!DOCTYPE html>
<html lang="en" data-theme="nebula" data-density="regular" data-glow="on">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flink SQL Playground</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%238b5cf6'/%3E%3Cpath d='M16 5l9 5-9 5-9-5 9-5z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M7 16l9 5 9-5' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="app">
    <!-- ===== Topbar ===== -->
    <header class="topbar">
        <div class="brand">
            <div class="brand-mark" data-icon="layers"></div>
            <div class="brand-text">
                <h1>Flink SQL Playground</h1>
                <p>Interactive streaming SQL for Apache Flink</p>
            </div>
        </div>
        <div class="brand-spacer"></div>
        <div class="topbar-actions">
            <span class="conn-pill"><i class="conn-dot"></i> <span id="status-build">build: --</span></span>
            <button id="tour-btn" class="btn ghost sm"><span data-icon="info" data-size="14"></span> Tour</button>
            <button id="tweaks-btn" class="icon-btn outline" title="Tweaks"><span data-icon="sliders" data-size="16"></span></button>
            <button id="theme-toggle" class="icon-btn outline" title="Toggle light / dark"><span data-icon="moon" data-size="16"></span></button>
        </div>
    </header>

    <!-- ===== Workspace ===== -->
    <div class="workspace">
        <aside id="schema-browser" class="sidebar">
            <div class="side-head">
                <span class="side-title"><span data-icon="db" data-size="13"></span> Tables</span>
                <button id="schema-browser-toggle" class="icon-btn ghost" title="Collapse"><span data-icon="chevL" data-size="14"></span></button>
            </div>
            <div class="side-body">
                <div id="schema-browser-empty" class="side-empty">
                    <div class="side-empty-ic"><span data-icon="db" data-size="22"></span></div>
                    <p>No tables yet.</p>
                    <span>Run <b>Build Schema</b> to register your DDL.</span>
                </div>
                <div id="schema-browser-list" class="tbl-list" style="display:none"></div>
            </div>
        </aside>

        <main class="editors">
            <div class="editor-row">
                <section class="pane editor-panel" id="schema-panel">
                    <div class="panel-head">
                        <span class="panel-title">Schema</span>
                        <span class="panel-badge">DDL</span>
                        <button class="icon-btn ghost panel-maximize-btn" title="Maximize panel"></button>
                    </div>
                    <div class="pane-body"><div id="schema-editor" class="editor-mount"></div></div>
                </section>
                <div class="pane-split"></div>
                <section class="pane editor-panel" id="query-panel">
                    <div class="panel-head">
                        <span class="panel-title">Query</span>
                        <span class="panel-badge">DML</span>
                        <button class="icon-btn ghost panel-maximize-btn" title="Maximize panel"></button>
                    </div>
                    <div class="pane-body"><div id="query-editor" class="editor-mount"></div></div>
                </section>
            </div>

            <!-- ===== Toolbar ===== -->
            <div class="toolbar">
                <button id="build-schema-btn" class="btn outline"><span data-icon="plus" data-size="15"></span> Build Schema</button>
                <button id="run-query-btn" class="btn run"><span data-icon="play" data-size="14"></span> <span class="run-label">Run Query</span></button>
                <div class="tb-sep"></div>
                <div class="segmented" id="mode-segmented" role="radiogroup" aria-label="Execution mode">
                    <button type="button" data-mode="STREAMING" class="is-on">Streaming</button>
                    <button type="button" data-mode="BATCH">Batch</button>
                </div>
                <div class="tb-select">
                    <select id="example-select" aria-label="Query preset"></select>
                    <span data-icon="chevD" data-size="14"></span>
                </div>
                <button id="share-btn" class="btn ghost"><span data-icon="share" data-size="14"></span> Share</button>
                <div class="tb-spacer"></div>
                <span class="tb-status st-ready" id="tb-status">
                    <i class="tb-status-dot"></i>
                    <span id="status-text">Session ready</span>
                </span>
            </div>

            <!-- ===== Results ===== -->
            <section class="results" id="results-panel">
                <div class="results-head">
                    <div class="results-tabs" id="results-tabs">
                        <button class="rtab is-active" data-tab="table"><span data-icon="grid" data-size="13"></span> Table</button>
                        <button class="rtab" data-tab="changelog"><span data-icon="pulse" data-size="13"></span> Changelog <span class="rtab-count" id="tab-count-changelog" style="display:none">0</span></button>
                        <button class="rtab" data-tab="throughput"><span data-icon="pulse" data-size="13"></span> Throughput</button>
                        <button class="rtab" data-tab="graph"><span data-icon="flow" data-size="13"></span> Job Graph</button>
                    </div>
                    <div class="results-meta">
                        <span class="res-run" id="res-run" style="display:none"><i class="rv-live-dot"></i> streaming</span>
                        <button class="icon-btn ghost panel-maximize-btn" title="Maximize panel"></button>
                    </div>
                </div>
                <div class="results-body" id="results-container"></div>
            </section>
        </main>
    </div>

    <footer class="statusbar">
        <span class="sb-item sb-session" id="status-session"><span data-icon="dot" data-size="9"></span> no session</span>
        <span class="sb-item" id="status-mode">Streaming</span>
        <span class="sb-item" id="status-rows">0 rows</span>
        <span class="sb-item" id="status-changelog">0 changelog events</span>
        <div class="sb-spacer"></div>
        <span class="sb-item">apache flink 2.2</span>
        <span class="sb-item sb-state st-ready" id="sb-state"><i></i> ready</span>
    </footer>
</div>

<div class="maxed-backdrop" id="maxed-backdrop" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
<script src="/js/examples.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
