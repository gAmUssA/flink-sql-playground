name: Build and Push Docker Image

# Publishes the portable ghcr image on RELEASE TAGS only (not every main push).
# Rationale: Railway builds & deploys from source on push, so the registry image
# isn't in the deploy path. Its job is offline/local demos — `docker pull` a cached,
# H2-only image and run it on a laptop with no network and no rebuild. Cutting a
# `v*` tag (or a manual dispatch) is when that image needs refreshing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Quarkus augmentation runs in the Gradle JVM and loads the compiled
          # (Java 25) classes, so the build must run on JDK 25.
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # Build the (platform-independent) Quarkus fast-jar (build/quarkus-app/) ONCE on the
      # native runner. This keeps the arm64 image build from compiling under QEMU emulation —
      # the cause of the prior 6-hour timeouts. The git SHA/branch are injected so the
      # deployed-build footer is accurate (the Docker context has no .git).
      - name: Build application jar
        run: ./gradlew quarkusBuild --no-daemon -PbuildCommit=${{ github.sha }} -PbuildBranch=${{ github.ref_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tag-triggered, so emit version tags + a moving `latest` that always
          # points at the newest release (convenient for `pull ...:latest` on a laptop).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest

      # Packages the prebuilt jar (Dockerfile.runtime). Only the lightweight jar
      # extraction runs per-arch, so the arm64 leg finishes in seconds under QEMU.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
