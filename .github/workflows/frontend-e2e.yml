name: Frontend (browser tests)

# Phone and desktop layout tests for the SPA in Chromium and WebKit, plus a Lighthouse
# mobile accessibility check. Serves the static files and stubs the API, so no backend runs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Browser tests
        run: npx playwright test

      - name: Lighthouse (mobile)
        run: |
          node scripts/serve-static.js 8790 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8790/ >/dev/null; then break; fi
            if [ "$i" -eq 30 ]; then echo "static server did not start within 30s" >&2; exit 1; fi
            sleep 1
          done
          node scripts/lighthouse-check.js http://127.0.0.1:8790/ accessibility=95
